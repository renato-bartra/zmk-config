# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable the Lily58 OLED Display (SSD1306, 128x32, on the left half only).
# The display starts OFF (pixels blanked) and is toggled by the both-spaces
# combo defined in lily58.keymap (custom &display_toggle behavior).
CONFIG_ZMK_DISPLAY=y

# Keep the auto-blank-on-idle behavior so the OLED blanks automatically
# ~60s after the last keypress (see CONFIG_ZMK_IDLE_TIMEOUT below).
# The custom &display_toggle behavior calls display_blanking_on/off
# directly, while the activity-state machine handles the auto-blank.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Auto-blank timeout in milliseconds (5s).
CONFIG_ZMK_IDLE_TIMEOUT=5000
